[build-system]
requires = [
    "scikit-build-core>=0.5",
    "nanobind>=2.0.0"
]
build-backend = "scikit_build_core.build"

# NOTE: Building this package requires a ROCm/HIP install that includes the
# native Origami library (liborigami + its CMake package); both are part of
# ROCm. See: https://rocm.docs.amd.com/en/latest/deploy/linux/quick_start.html
# By default (ORIGAMI_BUILD_FROM_SOURCE=OFF) the extension is built against the
# installed liborigami via find_package(origami); set CMAKE_PREFIX_PATH so your
# ROCm install (default: /opt/rocm) is discoverable, which resolves both
# find_package(hip) and find_package(origami). To build the native library from
# the in-tree source instead, pass -DORIGAMI_BUILD_FROM_SOURCE=ON.

[project]
name = "rocm-origami"
dynamic = ["version"]
description = "Analytical GEMM Solution Selection"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Advanced Micro Devices, Inc."}
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyyaml>=6.0",
]
torch = ["torch>=2.0.0"]

[tool.scikit-build]
wheel.packages = ["src/origami"]
cmake.version = ">=3.25"
build.verbose = true
# CMake source directory - use current directory (python/) which contains CMakeLists.txt
# By default python/CMakeLists.txt links against an installed origami
# (find_package); it builds origami from the parent directory only when
# ORIGAMI_BUILD_FROM_SOURCE=ON.
cmake.source-dir = "."
# CMake arguments
# CMAKE_PREFIX_PATH and CMAKE_CXX_COMPILER should be set via environment variables
# or passed via CMAKE_ARGS environment variable
cmake.args = [
    "-DCMAKE_BUILD_TYPE:STRING=Release",
]
# CMake defines - these can be overridden via environment
# CMAKE_PREFIX_PATH will be used by python/CMakeLists.txt
cmake.define = { ORIGAMI_BUILD_FROM_SOURCE = "OFF" }
# Dynamic version from __init__.py
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "src/origami/__init__.py"
metadata.version.regex = '^__version__\s*=\s*["\x27](?P<value>[^"\x27]+)["\x27]'
sdist.exclude = [
    "../../*",
    "../*",
    "*.md",
    "*.sh",
    "build/*",
    "*.egg-info/*",
]
wheel.exclude = [
    "../../*",
    "../*",
    "*.md",
    "*.sh",
    "tests/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests that require hardware",
    "regression: marks tests as ranking regression tests",
]
addopts = [
    "-ra",
    "--strict-markers",
]

